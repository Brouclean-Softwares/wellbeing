[package]
name = "wellbeing"
version = "0.1.0"
edition = "2024"

[dependencies]
accept-language = "3.1"
askama = "0.16"
askama_web = { version = "0.16", features = ["axum-0.8"] }
axum = { version = "0.8", features = ["multipart", "macros", "query"] }
axum-extra = { version = "0.12", features = ["cookie-private"] }
chrono = { version = "0.4", features = ["clock"] }
dotenv = "0.15"
fluent-templates = "0.14"
http = "1.4"
oauth2 = "5.0"
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.9", features = ["postgres", "runtime-tokio", "tls-rustls", "macros", "chrono"] }
thiserror = "2.0"
tokio = { version = "1.52", features = ["full"] }
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = "0.3"
unic-langid = "0.9"